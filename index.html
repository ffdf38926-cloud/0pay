<!-- Registration Form with Contact Info -->
<div class="registration-container" style="max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Retailer Registration</h2>
  
  <!-- FormSubmit Action: अपनी ईमेल आईडी से your-email@gmail.com को बदलें -->
  <form action="https://formsubmit.co/your-email@gmail.com" method="POST">
    
    <!-- Spam से बचने के लिए Captcha (Optional) -->
    <input type="hidden" name="_captcha" value="false">
    
    <div style="margin-bottom: 15px;">
      <label for="name">Full Name:</label><br>
      <input type="text" id="name" name="Name" required style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label for="phone">Mobile Number:</label><br>
      <input type="tel" id="phone" name="Phone" required style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label for="email">Email Address:</label><br>
      <input type="email" id="email" name="Email" required style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label for="shop">Shop / Business Name:</label><br>
      <input type="text" id="shop" name="Shop_Name" required style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <button type="submit" style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">Register Now</button>
  </form>

  <hr style="margin: 25px 0;">

  <!-- Office Contact Information Section -->
  <div class="contact-details">
    <h3>Office Address & Contact</h3>
    <p><strong>Mobile:</strong> <a href="tel:+918101964617">+91 8101964617</a></p>
    <p><strong>Address:</strong> Amrity, English Bazar, Sonatala, P.O. Amrity, District: Malda, West Bengal - 732208</p>
  </div>
</div>
